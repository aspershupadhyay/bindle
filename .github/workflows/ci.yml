name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  license-headers:
    name: Licence headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every source file carries the SPDX header
        run: |
          missing=$(grep -RL "SPDX-License-Identifier: Apache-2.0" --include="*.rs" --include="*.sql" --include="*.css" crates app || true)
          if [ -n "$missing" ]; then
            echo "Missing licence header in:"; echo "$missing"; exit 1
          fi
