# Builds Bindle for Android phones (weeks 18 to 20): a debug APK that can be
# installed on a phone to try Ours there. Started by hand from the Actions
# tab (once this file is on main), by a version tag, or by a push that
# changes the app shell or this file. The Android project is generated here by
# `tauri android init`; nothing Android-specific is kept in the repository
# besides `app/src-tauri/tauri.android.conf.json`.

name: Android

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "app/src-tauri/**"
      - "app/package.json"
      - "app/package-lock.json"
      - ".github/workflows/android.yml"

jobs:
  apk:
    name: Android APK (arm64, debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Install view dependencies
        working-directory: app
        run: npm ci
      - name: Make the Android project
        working-directory: app
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android init --ci
      - name: Build the APK
        working-directory: app
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --debug --apk --target aarch64 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: bindle-android-debug
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
