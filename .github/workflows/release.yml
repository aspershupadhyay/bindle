# Builds installers for Windows, macOS and Linux when a version tag such as
# v0.1.0 is pushed, and publishes them on a GitHub release, where the
# download page (site/) finds them. Signing happens only when its secrets are set (see
# docs/RELEASING.md); without them the installers are built unsigned, and
# the release notes say so.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Installers (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-22.04, args: "" }
          - { name: Windows, os: windows-latest, args: "" }
          - { name: macOS Apple silicon, os: macos-latest, args: "--target aarch64-apple-darwin" }
          - { name: macOS Intel, os: macos-latest, args: "--target x86_64-apple-darwin" }
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for the Tauri webview
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: app

      # Windows: import the code-signing certificate, if there is one, and
      # tell Tauri its thumbprint.
      - name: Windows signing certificate
        id: windows-cert
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "bindle.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint } } } | ConvertTo-Json -Compress -Depth 4
          "args=--config $config" >> $env:GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing and notarisation. Empty secrets mean an unsigned build.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Bindle ${{ github.ref_name }}
          releaseBody: |
            Installers for Windows, macOS and Linux. See CHANGELOG.md for what changed.
            Signed only where the signing secrets were set; see docs/RELEASING.md.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} ${{ steps.windows-cert.outputs.args }}
