# Builds installers for Windows, macOS and Linux when a version tag such as
# v0.1.0 is pushed, and publishes them on a GitHub release, where the
# download page (site/) finds them. Signing happens only when its secrets are set (see
# docs/RELEASING.md); without them the installers are built unsigned, and
# the release notes say so.
#
# The version comes from the tag: nothing needs bumping by hand. When the
# updater keys are set, each release also carries latest.json and signed
# update files, and installed copies of Bindle offer to update themselves.

name: Release

on:
  push:
    tags: ["v*"]
  # Started by hand from the Actions tab: GitHub makes the tag when it
  # publishes the release.
  workflow_dispatch:
    inputs:
      version:
        description: "Tag for the release, such as v0.0.1"
        required: true

permissions:
  contents: write

jobs:
  # One job makes the release (and, when started by hand, its tag), so the
  # four builds below never race to create it.
  release:
    name: Make the release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.make.outputs.id }}
      tag: ${{ steps.make.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
    steps:
      - id: make
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Bindle $TAG" \
              --notes "Installers for Windows, macOS and Linux. See CHANGELOG.md for what changed. Already have Bindle? It offers to update itself. Not signed yet: Windows and macOS ask once before opening (see the download page)."
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "id=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    name: Installers (${{ matrix.name }})
    needs: release
    runs-on: ${{ matrix.os }}
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-22.04, args: "" }
          - { name: Windows, os: windows-latest, args: "" }
          - { name: macOS Apple silicon, os: macos-latest, args: "--target aarch64-apple-darwin" }
          - { name: macOS Intel, os: macos-latest, args: "--target x86_64-apple-darwin" }
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for the Tauri webview
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: app

      # Stamps the tag's version into the app, and turns on the signed update
      # files when the updater's public key is set.
      - name: Version and updater
        working-directory: app
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: node scripts/release-config.mjs "${{ needs.release.outputs.tag }}"

      # Windows: import the code-signing certificate, if there is one, and
      # tell Tauri its thumbprint.
      - name: Windows signing certificate
        id: windows-cert
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "bindle.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint } } } | ConvertTo-Json -Compress -Depth 4
          "args=--config $config" >> $env:GITHUB_OUTPUT

      # macOS signing and notarisation, only when the secrets exist: an empty
      # certificate would make the build try, and fail, to sign.
      - name: macOS signing
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files. Unused when the updater is off.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          releaseId: ${{ needs.release.outputs.id }}
          # Windows updates use the .exe installer, quietly, like the download page.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} ${{ steps.windows-cert.outputs.args }}
