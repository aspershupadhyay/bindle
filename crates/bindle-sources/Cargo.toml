[package]
name = "bindle-sources"
description = "Where Bindle reads work from: GitHub reviews, pull requests and issues."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
bindle-core = { path = "../bindle-core" }
bindle-parse = { path = "../bindle-parse" }
bindle-store = { path = "../bindle-store" }
chrono.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
mail-parser = "0.11"
tokio = { version = "1", features = ["net", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"
reqwest = { version = "0.13", default-features = false, features = ["query", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time", "sync"] }
