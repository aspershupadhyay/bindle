[package]
name = "bindle-app"
description = "The Bindle desktop app: a Tauri shell around the Rust core."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "bindle_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bindle-cloud = { path = "../../crates/bindle-cloud" }
bindle-core = { path = "../../crates/bindle-core" }
bindle-mcp = { path = "../../crates/bindle-mcp" }
bindle-parse = { path = "../../crates/bindle-parse" }
bindle-sources = { path = "../../crates/bindle-sources" }
bindle-store = { path = "../../crates/bindle-store" }
chrono.workspace = true
iana-time-zone = "0.1"
# The GitHub token lives in the system keychain (handbook principle 5).
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
